name: Android Sender
run-name: ${{ github.ref_name }} Android sender build
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifactName:
        description: Name of the uploaded APK artifact
        value: ${{ jobs.android.outputs.artifactName }}
permissions:
  contents: read
jobs:
  android:
    name: Build Vcast APK 🤖
    runs-on: ubuntu-24.04
    outputs:
      artifactName: vcast-android
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu-24.04 runner image ships the Android SDK (platform 35 / build-tools)
      # with licenses accepted; AGP downloads anything else it needs.
      - name: Check Android SDK 🔎
        run: |
          : Check Android SDK 🔎
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms" || true

      - name: Optional release keystore 🔑
        env:
          KEYSTORE_BASE64: ${{ secrets.VCAST_KEYSTORE_BASE64 }}
        run: |
          : Optional release keystore 🔑
          # Without the secret the APK is signed with the committed debug keystore
          # (android/app/debug.keystore), which is fine for sideloading.
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "VCAST_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"
          fi

      - name: Build 🧱
        env:
          VCAST_VERSION_CODE: ${{ github.run_number }}
          VCAST_KEYSTORE_PASSWORD: ${{ secrets.VCAST_KEYSTORE_PASSWORD }}
          VCAST_KEY_ALIAS: ${{ secrets.VCAST_KEY_ALIAS }}
          VCAST_KEY_PASSWORD: ${{ secrets.VCAST_KEY_PASSWORD }}
        run: |
          : Build 🧱
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
          python3 -m py_compile tools/mock_receiver.py

      - name: Lint 🔍
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Collect APK 📦
        run: |
          : Collect APK 📦
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "${apk}"
          mkdir -p "${RUNNER_TEMP}/apk"
          cp "${apk}" "${RUNNER_TEMP}/apk/vcast-android.apk"
          apksigner="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/*/apksigner | sort -V | tail -1)"
          "${apksigner}" verify --print-certs "${RUNNER_TEMP}/apk/vcast-android.apk"
          ls -l "${RUNNER_TEMP}/apk"

      - name: Upload APK 📡
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vcast-android
          path: ${{ runner.temp }}/apk/vcast-android.apk
          if-no-files-found: error

      - name: Upload reports 📋
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vcast-android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
