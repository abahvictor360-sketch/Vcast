name: Website
run-name: Publish the Vcast website
on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    name: Publish site/ to GitHub Pages 🌐
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Push site to the gh-pages branch
        run: |
          set -euo pipefail
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::9}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Turn on GitHub Pages (first run only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already on."
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/"; then
            echo "GitHub Pages turned on."
          else
            echo "::warning::Could not turn on GitHub Pages automatically. Open Settings > Pages and choose 'Deploy from a branch', branch gh-pages, folder / (root)."
          fi
